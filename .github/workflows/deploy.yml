name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages serves a branch as-is ("Deploy from a branch"), so this workflow's job
# is to write the build output to that branch. Publishing itself is GitHub's own
# pages-build-deployment run, triggered by the push below.
permissions:
  contents: write

env:
  # The branch Settings → Pages is pointed at. It holds build output only — the
  # workflow overwrites whatever is on it.
  PUBLISH_BRANCH: pages-branch-deploy

# One in-flight deploy at a time; a newer push waits rather than cancels, so
# main and the published branch never diverge.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        # The site lives at https://<owner>.github.io/<repo>/, so every asset
        # URL has to be prefixed with the repository name.
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" pnpm build

      - name: Push build output to the publish branch
        # The branch holds a single commit, replaced on every deploy: it is
        # derived output, and a build is ~63 MB (the engine's scattering LUTs
        # and WASM), so keeping its history would grow the repository fast.
        working-directory: dist
        run: |
          # Without this, Pages hands the output to Jekyll, which skips files
          # and directories whose names begin with `_`.
          touch .nojekyll
          git init -q -b "$PUBLISH_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA} to GitHub Pages"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" \
            "$PUBLISH_BRANCH"
